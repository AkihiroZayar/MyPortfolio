<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zayar Thet Tun — Web Developer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%9D%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --bg:#0b0d10; --bg2:#101318; --panel:#151920;
  --line:rgba(255,255,255,.08);
  --text:#f2f4f7; --muted:#9aa3ad;
  --accent:#2f6bff; --accent-soft:rgba(47,107,255,.14);
  --danger:#ff5b5b;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
h1,h2,h3,.logo{font-family:'Archivo',sans-serif}
a{color:inherit;text-decoration:none}
button{font-family:'Inter',sans-serif;cursor:pointer}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}

/* ---------- Nav ---------- */
nav{position:fixed;top:0;left:0;right:0;z-index:50;background:rgba(11,13,16,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-in{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.logo .mark{color:var(--accent);font-size:20px}
.nav-links{display:flex;gap:28px;font-size:13.5px;color:var(--muted)}
.nav-links a:hover{color:var(--text)}
.nav-right{display:flex;align-items:center;gap:16px}
.lang-btn{background:none;border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:999px;font-size:12.5px;transition:.2s}
.lang-btn:hover{color:var(--text);border-color:var(--accent)}
.burger{display:none;background:none;border:0;color:var(--text);font-size:22px}

/* ---------- Hero ---------- */
.hero{position:relative;padding:140px 0 90px;background:
  radial-gradient(700px 400px at 60% 10%,rgba(47,107,255,.10),transparent 65%),var(--bg)}
.hero-grid{display:grid;grid-template-columns:1.15fr 320px .75fr;gap:44px;align-items:center}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:18px}
.eyebrow::before{content:"";width:34px;height:2px;background:var(--accent)}
.hero h1{font-size:clamp(40px,5.6vw,68px);font-weight:800;line-height:1.05;letter-spacing:-.02em}
.hero h1 span{color:var(--accent)}
.hero-sub{color:var(--muted);max-width:460px;margin-top:22px;font-size:15.5px}
.scroll-btn{margin-top:38px;display:inline-flex;width:56px;height:56px;border-radius:50%;background:var(--accent);align-items:center;justify-content:center;font-size:20px;color:#fff;transition:.25s}
.scroll-btn:hover{transform:translateY(4px)}
.avatar{width:300px;height:300px;border-radius:50%;background:linear-gradient(160deg,var(--panel),#0e1116);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:100px;justify-self:center;user-select:none;overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero-side{display:flex;flex-direction:column;gap:26px}
.side-block{border-top:1px solid var(--line);padding-top:16px}
.side-block h3{font-size:11.5px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
.side-block p{color:var(--muted);font-size:13.5px}
.side-block a{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid var(--accent);padding-bottom:3px}
.side-block a:hover{color:var(--accent)}
.socials{display:flex;gap:14px;margin-top:4px}
.socials a{width:36px;height:36px;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;transition:.2s}
.socials a:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- Sections ---------- */
section{padding:96px 0;border-top:1px solid var(--line)}
.sec-label{color:var(--accent);font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:14px}
.sec-label::before{content:"/ "}
h2{font-size:clamp(28px,3.8vw,44px);font-weight:800;letter-spacing:-.015em;line-height:1.15}

.about-grid{display:grid;grid-template-columns:1.1fr 1fr;gap:64px;align-items:start;margin-top:8px}
.about-left p{color:var(--muted);margin-top:20px;font-size:15px;white-space:pre-line}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:40px}
.stat .num{font-family:'Archivo';font-size:60px;font-weight:800;line-height:1;color:var(--text)}
.stat .num em{color:var(--accent);font-style:normal}
.stat .lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.stat p{color:var(--muted);font-size:13.5px;margin-top:14px}

.strip{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:26px 0;background:var(--bg2)}
.strip-in{display:flex;align-items:center;gap:40px;flex-wrap:wrap}
.strip-lbl{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);cursor:default;user-select:none}
.strip-items{display:flex;gap:36px;flex-wrap:wrap;font-family:'Archivo';font-weight:700;color:#c7ced6;font-size:15px}
.strip-items span{opacity:.75;transition:.2s;cursor:default}
.strip-items span:hover{opacity:1;color:var(--accent)}

.skills-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:44px}
.skill{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:26px 22px;transition:.25s}
.skill:hover{border-color:var(--accent);transform:translateY(-4px)}
.skill .ic{font-size:26px}
.skill h3{font-size:15.5px;margin:14px 0 6px}
.skill p{color:var(--muted);font-size:13px}

.proj-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:44px}
.proj{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 24px;display:flex;flex-direction:column;transition:.25s}
.proj:hover{border-color:var(--accent);transform:translateY(-5px)}
.proj .top{display:flex;justify-content:space-between;align-items:center}
.proj .ic{font-size:30px}
.proj .tag{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.proj h3{font-size:18px;margin:18px 0 8px}
.proj p{color:var(--muted);font-size:13.5px;flex:1}
.proj .tech{margin-top:18px;display:flex;gap:8px;flex-wrap:wrap}
.proj .tech span{font-size:11px;color:var(--muted);border:1px solid var(--line);padding:3px 9px;border-radius:999px}

.contact{text-align:center;background:radial-gradient(500px 260px at 50% 100%,rgba(47,107,255,.12),transparent 70%),var(--bg)}
.contact p{color:var(--muted);max-width:480px;margin:18px auto 0}
.cta{display:inline-block;margin-top:34px;background:var(--accent);color:#fff;padding:15px 38px;border-radius:999px;font-family:'Archivo';font-weight:700;font-size:15px;transition:.25s}
.cta:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(47,107,255,.35)}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted);font-size:13px}
.foot-in{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}

.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s ease,transform .7s ease}
.reveal.in{opacity:1;transform:none}

/* ---------- Animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(47,107,255,.22),0 30px 60px rgba(0,0,0,.5)}50%{box-shadow:0 0 60px 10px rgba(47,107,255,.30),0 30px 60px rgba(0,0,0,.5)}}
@keyframes bounceY{0%,100%{transform:translateY(0)}50%{transform:translateY(8px)}}
@keyframes scrollX{to{transform:translateX(-50%)}}
@keyframes underline{from{width:0}to{width:34px}}
.hero .eyebrow{animation:fadeUp .7s .05s both}
.hero .eyebrow::before{animation:underline .8s .5s both}
.hero h1{animation:fadeUp .8s .2s both}
.hero-sub{animation:fadeUp .8s .38s both}
.hero .scroll-btn{animation:fadeUp .7s .55s both, bounceY 2.4s 1.6s ease-in-out infinite}
.hero-side .side-block:nth-child(1){animation:fadeUp .7s .45s both}
.hero-side .side-block:nth-child(2){animation:fadeUp .7s .6s both}
.hero-side .side-block:nth-child(3){animation:fadeUp .7s .75s both}
.avatar{animation:fadeUp .8s .3s both, floaty 6s 1.2s ease-in-out infinite, glow 6s 1.2s ease-in-out infinite}
.skill:hover .ic,.proj:hover .ic{transform:scale(1.25) rotate(-8deg)}
.skill .ic,.proj .ic{display:inline-block;transition:transform .3s ease}
.marquee{overflow:hidden;flex:1;min-width:0;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee .strip-items{flex-wrap:nowrap;width:max-content;gap:52px;animation:scrollX 24s linear infinite}
.marquee:hover .strip-items{animation-play-state:paused}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important}
}
@media (prefers-reduced-motion: reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}

/* Byte easter egg */
.avatar{cursor:pointer}
@keyframes byteSpin{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(1.15)}100%{transform:rotate(360deg) scale(1)}}
.avatar.spin{animation:byteSpin .8s ease !important}
.byte-bubble{position:absolute;background:var(--panel);border:1px solid var(--accent);color:var(--text);font-size:13px;padding:8px 14px;border-radius:12px;white-space:nowrap;transform:translate(-50%,-14px);left:50%;top:-14px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:5}
.byte-bubble.show{opacity:1;transform:translate(-50%,-30px)}
.byte-bubble::after{content:"";position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);border:6px solid transparent;border-top-color:var(--accent)}
.confetti-piece{position:fixed;top:-20px;font-size:20px;pointer-events:none;z-index:99;animation:confettiFall linear forwards}
@keyframes confettiFall{to{transform:translateY(110vh) rotate(360deg);opacity:.2}}

/* Mascot scroll reaction bubble (fixed, small, corner) */
.byte-peek{position:fixed;bottom:18px;right:18px;width:52px;height:52px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:26px;z-index:40;cursor:pointer;box-shadow:0 10px 24px rgba(0,0,0,.35);transform:translateY(90px);transition:transform .4s ease}
.byte-peek.show{transform:translateY(0)}
.byte-peek .tip{position:absolute;right:60px;bottom:8px;background:var(--panel);border:1px solid var(--line);padding:7px 12px;border-radius:10px;font-size:12.5px;white-space:nowrap;opacity:0;transform:translateX(6px);transition:opacity .25s,transform .25s}
.byte-peek:hover .tip{opacity:1;transform:translateX(0)}
@media (prefers-reduced-motion: reduce){.byte-peek,.avatar.spin,.confetti-piece{animation:none !important;transition:none !important}}

/* ---------- Modals & Admin ---------- */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);backdrop-filter:blur(4px);z-index:90;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:34px;width:100%;max-width:380px;text-align:center}
.modal h3{font-size:20px;margin-bottom:6px}
.modal p{color:var(--muted);font-size:13px;margin-bottom:20px}
.modal input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:12px 14px;font-size:16px;text-align:center;letter-spacing:.3em}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal .err{color:var(--danger);font-size:12.5px;margin-top:10px;min-height:16px}
.modal .btn-row{display:flex;gap:10px;margin-top:18px}
.btn{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);font-size:14px;transition:.2s}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn.danger{color:var(--danger)}
.btn.danger:hover{border-color:var(--danger)}

/* Admin panel */
.admin{position:fixed;inset:0;z-index:100;background:var(--bg);display:none;flex-direction:column}
.admin.show{display:flex}
.admin-head{display:flex;align-items:center;justify-content:space-between;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--bg2)}
.admin-head h3{font-size:16px;display:flex;align-items:center;gap:8px}
.admin-head .dot{width:8px;height:8px;border-radius:50%;background:#37d67a}
.admin-tabs{display:flex;gap:4px;padding:10px 22px 0;border-bottom:1px solid var(--line);background:var(--bg2);overflow-x:auto}
.admin-tabs button{background:none;border:none;color:var(--muted);padding:10px 16px;font-size:13.5px;border-bottom:2px solid transparent;white-space:nowrap}
.admin-tabs button.on{color:var(--text);border-color:var(--accent)}
.admin-body{flex:1;overflow-y:auto;padding:26px 22px 90px}
.admin-body .inner{max-width:820px;margin:0 auto}
.fgroup{margin-bottom:18px}
.fgroup label{display:block;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.fgroup input,.fgroup textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:10px 12px;font-size:14px;font-family:'Inter',sans-serif}
.fgroup textarea{min-height:74px;resize:vertical}
.fgroup input:focus,.fgroup textarea:focus{outline:none;border-color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card-edit{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px}
.card-edit .ce-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.card-edit .ce-head strong{font-size:14px}
.mini{padding:6px 12px;font-size:12px;border-radius:8px;flex:none}
.admin-foot{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--line);padding:12px 22px;display:flex;gap:10px;justify-content:flex-end;z-index:101}
.admin-foot .status{margin-right:auto;color:var(--muted);font-size:12.5px;align-self:center}
.add-btn{width:100%;padding:13px;border:1px dashed var(--line);background:none;color:var(--muted);border-radius:12px;font-size:14px;transition:.2s}
.add-btn:hover{color:var(--accent);border-color:var(--accent)}

@media(max-width:1100px){
  .hero-grid{grid-template-columns:1fr .8fr}
  .avatar{display:none}
}
@media(max-width:860px){
  .nav-links{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg2);flex-direction:column;gap:0;border-bottom:1px solid var(--line)}
  .nav-links.open{display:flex}
  .nav-links a{padding:16px 24px;border-top:1px solid var(--line)}
  .burger{display:block}
  .hero{padding:120px 0 70px}
  .hero-grid,.about-grid{grid-template-columns:1fr;gap:40px}
  .skills-grid{grid-template-columns:1fr 1fr}
  .proj-grid{grid-template-columns:1fr}
  .frow{grid-template-columns:1fr}
}
@media(max-width:480px){.skills-grid{grid-template-columns:1fr}}
</style>
</head>

    if(data && data.data) return data.data;
  }catch(e){ console.warn("Couldn't load from Supabase, showing defaults", e); }
  return JSON.parse(JSON.stringify(DEFAULT_DATA));
}
async function saveData(){
  if(!isAdmin){ console.warn("Not signed in — refusing to save."); return {ok:false, error:"Not signed in"}; }
  const { error } = await sb.from('portfolio').upsert({ id: PORTFOLIO_ROW_ID, data: DATA });
  if(error){ console.error(error); return {ok:false, error: error.message}; }
  return {ok:true};
}
function t(obj){ return (obj && typeof obj === 'object') ? (obj[lang] ?? obj.en ?? "") : (obj ?? ""); }
function esc(s){ const d=document.createElement('div'); d.textContent=s??""; return d.innerHTML; }

// Only used for the hero title, which intentionally supports basic styling
// (<span> for the accent color, <br> for a line break). Anything else —
// scripts, event handlers, other tags — is stripped before it ever
// touches innerHTML, so an untrusted imported file can't inject code.
function sanitizeTitleHTML(html){
  const div = document.createElement('div');
  div.innerHTML = html ?? "";
  const allowed = new Set(['SPAN','BR']);
  (function clean(node){
    [...node.childNodes].forEach(child=>{
      if(child.nodeType === 1){
        if(!allowed.has(child.tagName)){
          child.replaceWith(...child.childNodes);
        }else{
          [...child.attributes].forEach(a=>child.removeAttribute(a.name));
          clean(child);
        }
      }
    });
  })(div);
  return div.innerHTML;
}

/* ---------- Count-up animation for stats ---------- */
const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function setupCountUp(){
  document.querySelectorAll('.stat .num').forEach(el=>{
    const target = parseInt(el.dataset.count, 10);
    if(isNaN(target) || reduceMotion) return;
    const em = el.querySelector('em');
    const suffix = em ? em.outerHTML : "";
    const obs = new IntersectionObserver(entries=>{
      entries.forEach(en=>{
        if(!en.isIntersecting) return;
        obs.unobserve(el);
        const dur = 1200, start = performance.now();
        function tick(now){
          const p = Math.min((now-start)/dur, 1);
          const eased = 1 - Math.pow(1-p, 3);
          el.innerHTML = Math.round(target*eased) + suffix;
          if(p < 1) requestAnimationFrame(tick);
        }
        requestAnimationFrame(tick);
      });
    },{threshold:.5});
    obs.observe(el);
  });
}

/* ---------- Scroll reveal ---------- */
const io = new IntersectionObserver(entries=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} });
},{threshold:.12});
function observeReveals(){ document.querySelectorAll('.reveal:not(.in)').forEach(el=>io.observe(el)); }

async function tryLogin(){
  const now = Date.now();
  if(now < lockedUntil){
    const secs = Math.ceil((lockedUntil-now)/1000);
    pwErr.textContent = `Too many attempts. Try again in ${secs}s.`;
    return;
  }
  pwErr.textContent = "Signing in…";
  // Real authentication — checked by Supabase's servers, never visible in this file.
  const { data, error } = await sb.auth.signInWithPassword({
    email: emailInput.value.trim(),
    password: pwInput.value
  });
  if(!error && data?.session){
    failedAttempts = 0;
    isAdmin = true;
    loginOverlay.classList.remove('show');
    openAdmin();
  }else{
    failedAttempts++;
    if(failedAttempts >= 5){
      lockedUntil = Date.now() + 30000; // 30s lockout after 5 wrong tries
      pwErr.textContent = "Too many attempts. Try again in 30s.";
    }else{
      pwErr.textContent = "Wrong email or password. Try again.";
    }
    pwInput.value = "";
    pwInput.focus();
  }
}

function get(obj, path){ return path.reduce((o,k)=>o?.[k], obj); }
function set(obj, path, val){
  const last = path[path.length-1];
  const parent = path.slice(0,-1).reduce((o,k)=>o[k], obj);
  parent[last] = val;
}
function fieldEN_JA(labelTxt, path, textarea=false){
  const id = 'f' + Math.random().toString(36).slice(2,9);

  const tagO = textarea?'<textarea':'<input', tagC = textarea?'</textarea>':'';
  const valEN = textarea? esc(v.en) : '', valJA = textarea? esc(v.ja) : '';
  const attrEN = textarea? '' : ` value="${esc(v.en)}"`;
  const attrJA = textarea? '' : ` value="${esc(v.ja)}"`;
  setTimeout(()=>{
    document.getElementById(id+'en')?.addEventListener('input', e=>{ get(DRAFT,path).en = e.target.value; });
    document.getElementById(id+'ja')?.addEventListener('input', e=>{ get(DRAFT,path).ja = e.target.value; });
  });
  return `<div class="frow">
    <div class="fgroup"><label>${labelTxt} (EN)</label>${tagO} id="${id}en"${attrEN}>${valEN}${tagC}</div>
    <div class="fgroup"><label>${labelTxt} (日本語)</label>${tagO} id="${id}ja"${attrJA}>${valJA}${tagC}</div>
  </div>`;
}
function fieldPlain(labelTxt, path, textarea=false){
  const id = 'f' + Math.random().toString(36).slice(2,9);
  const v = get(DRAFT, path) ?? "";
  setTimeout(()=>{
    document.getElementById(id)?.addEventListener('input', e=> set(DRAFT, path, e.target.value));
  });
  return `<div class="fgroup"><label>${labelTxt}</label>${
    textarea ? `<textarea id="${id}">${esc(v)}</textarea>` : `<input id="${id}" value="${esc(v)}">`
  }</div>`;
}

/* ---- tab builders ---- */
function buildTab(){
  adminBody.innerHTML = "";
  let html = "";
  if(curTab===0){ // Hero
    html += `<h3 style="margin:0 0 12px;font-size:15px">Profile photo</h3>
    <div class="card-edit">
      <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
        <div id="avPrev" style="width:76px;height:76px;border-radius:50%;overflow:hidden;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:36px;flex:none">${
          DRAFT.avatar ? `<img src="${DRAFT.avatar}" style="width:100%;height:100%;object-fit:cover">` : "🦝"
        }</div>
        <button class="btn mini" id="avUp">📷 Upload my photo</button>
        <button class="btn mini danger" id="avRm">Use raccoon 🦝 (default)</button>
        <input type="file" id="avFile" accept="image/*" hidden>
      </div>
      <p style="color:var(--muted);font-size:12px;margin-top:10px">The photo is saved with your content and included in Export JSON. If no photo is set, Byte the raccoon is shown.</p>
    </div>`;
    html += fieldEN_JA("Eyebrow", ["hero","eyebrow"]);
    html += fieldEN_JA("Big title (HTML allowed: <span>, <br>)", ["hero","title"], true);
    html += fieldEN_JA("Subtitle", ["hero","sub"], true);
    html += `<hr style="border:0;border-top:1px solid var(--line);margin:20px 0">`;
    html += fieldEN_JA("Side box 1 — heading", ["hero","side1h"]);
    html += fieldEN_JA("Side box 1 — text", ["hero","side1p"], true);
    html += fieldEN_JA("Side box 2 — heading", ["hero","side2h"]);
    html += fieldEN_JA("Side box 2 — text", ["hero","side2p"], true);
    html += fieldEN_JA("Follow heading", ["hero","followh"]);
  }
  else if(curTab===1){ // About
    html += fieldEN_JA("Heading", ["about","heading"]);
    html += fieldEN_JA("About text", ["about","text"], true);
    html += `<h3 style="margin:22px 0 12px;font-size:15px">Stats</h3>`;
    DRAFT.about.stats.forEach((s,i)=>{
      html += `<div class="card-edit">
        <div class="ce-head"><strong>Stat ${i+1}</strong>
          <button class="btn mini danger" data-delstat="${i}">Delete</button></div>
        ${fieldPlain("Number", ["about","stats",i,"num"])}
        ${fieldPlain("Suffix (e.g. +)", ["about","stats",i,"suffix"])}
        ${fieldEN_JA("Label", ["about","stats",i,"label"])}
        ${fieldEN_JA("Description", ["about","stats",i,"desc"], true)}
      </div>`;
    });
    html += `<button class="add-btn" id="addStat">＋ Add stat</button>`;
  }
  else if(curTab===2){ // Skills
    html += fieldEN_JA("Section heading", ["skillsHeading"]);
    DRAFT.skills.forEach((s,i)=>{
      html += `<div class="card-edit">
        <div class="ce-head"><strong>Skill ${i+1}</strong>
          <button class="btn mini danger" data-delskill="${i}">Delete</button></div>
        ${fieldPlain("Icon (emoji)", ["skills",i,"icon"])}
        ${fieldEN_JA("Title", ["skills",i,"title"])}
        ${fieldEN_JA("Description", ["skills",i,"desc"], true)}
      </div>`;
    });
    html += `<button class="add-btn" id="addSkill">＋ Add skill</button>`;
  }
  else if(curTab===3){ // Projects
    html += fieldEN_JA("Section heading", ["projHeading"]);
    DRAFT.projects.forEach((p,i)=>{
      if(typeof p._tech !== 'string') p._tech = (p.tech||[]).join(", ");
      html += `<div class="card-edit">
        <div class="ce-head"><strong>${esc(p.title)||("Project "+(i+1))}</strong>
          <span style="display:flex;gap:8px">
            <button class="btn mini" data-upproj="${i}" ${i===0?'disabled':''}>↑</button>
            <button class="btn mini" data-downproj="${i}" ${i===DRAFT.projects.length-1?'disabled':''}>↓</button>
            <button class="btn mini danger" data-delproj="${i}">Delete</button>
          </span></div>
        ${fieldPlain("Icon (emoji / character)", ["projects",i,"icon"])}
        ${fieldPlain("Project title", ["projects",i,"title"])}
        ${fieldEN_JA("Tag", ["projects",i,"tag"])}
        ${fieldEN_JA("Description", ["projects",i,"desc"], true)}
        ${fieldPlain("Tech tags (comma separated)", ["projects",i,"_tech"])}

    html += `<button class="add-btn" id="addProj">＋ Add new project</button>`;

    html += fieldEN_JA("Heading", ["contact","heading"]);

    html += fieldPlain("Contact email", ["contact","email"]);

    DRAFT.socials.forEach((s,i)=>{
      html += `<div class="card-edit">

          <button class="btn mini danger" data-delsoc="${i}">Delete</button></div>
        ${fieldPlain("Icon (emoji/char)", ["socials",i,"icon"])}

    html += `<h3 style="margin:22px 0 12px;font-size:15px">Footer</h3>`;

  adminBody.innerHTML = html;

function bindListButtons(){
  // Avatar photo upload / remove
  const avUp = adminBody.querySelector('#avUp');
  if(avUp){
    const avFile = adminBody.querySelector('#avFile');
    avUp.addEventListener('click', ()=> avFile.click());
    avFile.addEventListener('change', e=>{
      const f = e.target.files[0]; if(!f) return;
      const r = new FileReader();
      r.onload = ()=>{
        const img = new Image();
        img.onload = ()=>{
          // downscale to max 600px so it fits comfortably in saved data
          const max = 600;
          const scale = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width*scale); c.height = Math.round(img.height*scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          DRAFT.avatar = c.toDataURL('image/jpeg', .85);
          buildTab();
          setStatus("Photo added — press Save to apply.");
        };
        img.src = r.result;
      };
      r.readAsDataURL(f);
      e.target.value = "";
    });
    adminBody.querySelector('#avRm').addEventListener('click', ()=>{
      DRAFT.avatar = null;
      buildTab();
      setStatus("Back to Byte 🦝 — press Save to apply.");
    });
  }

  adminBody.querySelector('#addStat')?.addEventListener('click', ()=>{
    DRAFT.about.stats.push({num:"0",suffix:"",label:{en:"New stat",ja:"新しい統計"},desc:{en:"",ja:""}});
    buildTab();
  });
  adminBody.querySelector('#addSkill')?.addEventListener('click', ()=>{
    DRAFT.skills.push({icon:"✨",title:{en:"New skill",ja:"新しいスキル"},desc:{en:"",ja:""}});
    buildTab();
  });
  adminBody.querySelector('#addProj')?.addEventListener('click', ()=>{
    DRAFT.projects.push({icon:"🆕",tag:{en:"New",ja:"新規"},title:"New project",desc:{en:"",ja:""},tech:[],_tech:""});
    buildTab();
  });
  adminBody.querySelector('#addSoc')?.addEventListener('click', ()=>{
    DRAFT.socials.push({icon:"🔗",label:"New link",url:"#"});
    buildTab();
  });
  adminBody.querySelectorAll('[data-delstat]').forEach(b=>b.addEventListener('click',()=>{ DRAFT.about.stats.splice(+b.dataset.delstat,1); buildTab(); }));
  adminBody.querySelectorAll('[data-delskill]').forEach(b=>b.addEventListener('click',()=>{ DRAFT.skills.splice(+b.dataset.delskill,1); buildTab(); }));
  adminBody.querySelectorAll('[data-delsoc]').forEach(b=>b.addEventListener('click',()=>{ DRAFT.socials.splice(+b.dataset.delsoc,1); buildTab(); }));
  adminBody.querySelectorAll('[data-delproj]').forEach(b=>b.addEventListener('click',()=>{
    if(confirm("Delete this project?")){ DRAFT.projects.splice(+b.dataset.delproj,1); buildTab(); }
  }));
  adminBody.querySelectorAll('[data-upproj]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.upproj; [DRAFT.projects[i-1],DRAFT.projects[i]]=[DRAFT.projects[i],DRAFT.projects[i-1]]; buildTab();
  }));
  adminBody.querySelectorAll('[data-downproj]').forEach(b=>b.addEventListener('click',()=>{
    const i=+b.dataset.downproj; [DRAFT.projects[i+1],DRAFT.projects[i]]=[DRAFT.projects[i],DRAFT.projects[i+1]]; buildTab();
  }));
}

/* ---- Save / export / import / reset ---- */
document.getElementById('btnSave').addEventListener('click', async ()=>{
  // normalize comma-separated helper fields
  DRAFT.projects.forEach(p=>{
    if(typeof p._tech === 'string'){ p.tech = p._tech.split(',').map(s=>s.trim()).filter(Boolean); }
    delete p._tech;
  });
  if(typeof DRAFT.strip._items === 'string'){
    DRAFT.strip.items = DRAFT.strip._items.split(',').map(s=>s.trim()).filter(Boolean);
  }
  delete DRAFT.strip._items;
  DATA = JSON.parse(JSON.stringify(DRAFT));
  setStatus("Saving…");
  const res = await saveData();
  render();
  setStatus(res.ok ? "✅ Saved! Live for everyone now." : ("⚠️ Save failed: " + res.error));
  // rebuild draft helper fields so panel keeps working
  DRAFT = JSON.parse(JSON.stringify(DATA));
  buildTab();
});

document.getElementById('btnExport').addEventListener('click', ()=>{
  const blob = new Blob([JSON.stringify(DATA, null, 2)], {type:"application/json"});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = "portfolio-data.json";
  a.click();
  URL.revokeObjectURL(a.href);
  setStatus("Exported portfolio-data.json — keep it as a backup.");
});

document.getElementById('btnImport').addEventListener('click', ()=> document.getElementById('importFile').click());
document.getElementById('importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  if(f.size > 2_000_000){ setStatus("⚠️ Import failed: file too large."); e.target.value=""; return; }
  const r = new FileReader();
  r.onload = async ()=>{
    try{
      const parsed = JSON.parse(r.result);
      if(!parsed || typeof parsed !== 'object') throw new Error("Not a valid JSON object");
      if(!parsed.hero || !Array.isArray(parsed.projects) || !Array.isArray(parsed.skills))
        throw new Error("Not a portfolio data file");
      // Hero title is the only field ever inserted as HTML — sanitize on the way in too.
      if(parsed.hero.title){
        parsed.hero.title.en = sanitizeTitleHTML(parsed.hero.title.en);
        parsed.hero.title.ja = sanitizeTitleHTML(parsed.hero.title.ja);
      }
      DATA = parsed;
      const res = await saveData();
      render();
      DRAFT = JSON.parse(JSON.stringify(DATA)); buildTab();
      setStatus(res.ok ? "✅ Imported and saved live." : ("⚠️ Imported locally, but save failed: " + res.error));
    }catch(err){ setStatus("⚠️ Import failed: " + err.message); }
  };
  r.readAsText(f);
  e.target.value = "";
});

document.getElementById('btnReset').addEventListener('click', async ()=>{
  if(confirm("Reset ALL content to the built-in defaults? This updates the live site for everyone.")){
    DATA = JSON.parse(JSON.stringify(DEFAULT_DATA));
    const res = await saveData();
    render();
    DRAFT = JSON.parse(JSON.stringify(DATA)); buildTab();
    setStatus(res.ok ? "Reset to defaults and saved live." : ("⚠️ Reset locally, but save failed: " + res.error));
  }
});

/* =====================================================
   Byte easter egg — click the avatar a few times
===================================================== */
const EASTER_LINES = {
  en: ["Whee! 🦝", "Byte says hi!", "Do that again!", "Keep clicking...", "You found me!"],
  ja: ["わーい！🦝", "バイトだよ！", "もう一回！", "クリックし続けて…", "見つかったね！"]
};
let byteClicks = 0, byteClickTimer = null;
function spawnConfetti(originEl){
  const rect = originEl.getBoundingClientRect();
  const bits = ["🦝","✨","🍁","⭐","💫"];
  for(let i=0;i<14;i++){
    const p = document.createElement('span');
    p.className = 'confetti-piece';
    p.textContent = bits[Math.floor(Math.random()*bits.length)];
    p.style.left = (rect.left + rect.width/2 + (Math.random()*160-80)) + "px";
    p.style.animationDuration = (1.4 + Math.random()*1) + "s";
    p.style.fontSize = (14 + Math.random()*14) + "px";
    document.body.appendChild(p);
    setTimeout(()=> p.remove(), 2600);
  }
}
document.getElementById('avatar').addEventListener('click', function(){
  if(reduceMotion){ return; }
  byteClicks++;
  clearTimeout(byteClickTimer);
  byteClickTimer = setTimeout(()=> byteClicks = 0, 1500);

  this.classList.remove('spin'); void this.offsetWidth; this.classList.add('spin');

  let bubble = this.querySelector('.byte-bubble');
  if(!bubble){
    bubble = document.createElement('div');
    bubble.className = 'byte-bubble';
    this.style.position = 'relative';
    this.appendChild(bubble);
  }
  const lines = EASTER_LINES[lang] || EASTER_LINES.en;
  bubble.textContent = lines[Math.min(byteClicks-1, lines.length-1)];
  bubble.classList.add('show');
  clearTimeout(bubble._hideTimer);
  bubble._hideTimer = setTimeout(()=> bubble.classList.remove('show'), 1400);

  if(byteClicks >= 5){
    byteClicks = 0;
    spawnConfetti(this);
    bubble.textContent = lang==='ja' ? "やったー！🎉" : "You did it! 🎉";
  }
});

/* =====================================================
   Mascot scroll reactions — Byte peeks in the corner
===================================================== */
const PEEK_LINES = {
  top:      {en:"Welcome! 👋", ja:"ようこそ！👋"},
  about:    {en:"That's me, in the details.", ja:"ここが私の紹介だよ。"},
  skills:   {en:"Lots of skills here!", ja:"スキルがいっぱい！"},
  projects: {en:"My favorite part 🚀", ja:"お気に入りの部分だよ🚀"},
  contact:  {en:"Say hi anytime!", ja:"いつでも気軽に連絡してね！"}
};
const bytePeek = document.getElementById('bytePeek');
const bytePeekTip = document.getElementById('bytePeekTip');
const bytePeekFace = document.getElementById('bytePeekFace');

function updatePeekFace(){
  bytePeekFace.textContent = DATA.avatar ? "🦝" : "🦝"; // always Byte in the corner, even if hero shows the user's photo
}

const peekSections = ["top","about","skills","projects","contact"];
const peekObserver = new IntersectionObserver(entries=>{
  entries.forEach(en=>{
    if(en.isIntersecting){
      const id = en.target.id;
      const lines = PEEK_LINES[id];
      if(lines) bytePeekTip.textContent = t(lines);
    }
  });
},{threshold:.5});
peekSections.forEach(id=>{
  const el = document.getElementById(id);
  if(el) peekObserver.observe(el);
});

let peekShown = false;
window.addEventListener('scroll', ()=>{
  if(reduceMotion) return;
  if(window.scrollY > 300 && !peekShown){
    peekShown = true;
    bytePeek.classList.add('show');
  }
}, {passive:true});

bytePeek.addEventListener('click', ()=>{
  bytePeek.style.transform = 'translateY(0) scale(1.15)';
  setTimeout(()=> bytePeek.style.transform = 'translateY(0) scale(1)', 200);
  document.getElementById('top').scrollIntoView({behavior:'smooth'});
});

/* ---------- Init ---------- */
async function init(){
  render();      // paint instantly with defaults so the page never looks empty
  observeReveals();
  updatePeekFace();

  const { data: sessionData } = await sb.auth.getSession();
  isAdmin = !!sessionData?.session;

  DATA = await loadData();  // now fetch the real live content
  render();
  observeReveals();
}
init();
